<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a0a1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="16" y1="8" x2="48" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="url(#accent)" stroke-width="2"/>
  <!-- Squid tentacles (abstract neural lines) -->
  <g filter="url(#glow)" opacity="0.6">
    <path d="M32 42 Q20 50 14 54" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M32 42 Q28 52 24 56" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M32 42 Q36 52 40 56" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M32 42 Q44 50 50 54" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Squid head / AI brain -->
  <ellipse cx="32" cy="28" rx="14" ry="16" fill="url(#accent)" opacity="0.9"/>
  <!-- Eyes -->
  <ellipse cx="26" cy="26" rx="3.5" ry="4" fill="#0a0a0a"/>
  <ellipse cx="38" cy="26" rx="3.5" ry="4" fill="#0a0a0a"/>
  <!-- Eye highlights -->
  <ellipse cx="27" cy="24.5" rx="1.5" ry="1.8" fill="white" opacity="0.8"/>
  <ellipse cx="39" cy="24.5" rx="1.5" ry="1.8" fill="white" opacity="0.8"/>
</svg>
